<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雷區測繪</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a single survey sheet — header strip with counters, the grid as the map, a legend line below. */
:root {
  --paper: #e8ebe2;
  --sheet: #f4f5ef;
  --ink: #1d2721;
  --muted: #5d6a60;
  --line: #c3cabb;
  --tile: #8e9f80;
  --tile-hi: #a9b89b;
  --tile-lo: #6f8063;
  --open: #f4f5ef;
  --signal: #cf4f1a;
  --signal-ink: #ffffff;
  --win: #2f7a4b;
  --n1: #2457a6; --n2: #2c7a3c; --n3: #b8361f; --n4: #3c2a86;
  --n5: #7d2b1f; --n6: #17797a; --n7: #1d2721; --n8: #6b726c;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a17; --sheet: #1b2320; --ink: #e3e9df; --muted: #93a096; --line: #33403a;
    --tile: #4d5f4f; --tile-hi: #62765f; --tile-lo: #36443a; --open: #222b27;
    --signal: #f06a2e; --signal-ink: #1b0d05; --win: #5cc486;
    --n1: #7fa8f0; --n2: #79c98a; --n3: #f08a70; --n4: #b6a3f5;
    --n5: #e9a37c; --n6: #6fd0cf; --n7: #e3e9df; --n8: #9aa59d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141a17; --sheet: #1b2320; --ink: #e3e9df; --muted: #93a096; --line: #33403a;
  --tile: #4d5f4f; --tile-hi: #62765f; --tile-lo: #36443a; --open: #222b27;
  --signal: #f06a2e; --signal-ink: #1b0d05; --win: #5cc486;
  --n1: #7fa8f0; --n2: #79c98a; --n3: #f08a70; --n4: #b6a3f5;
  --n5: #e9a37c; --n6: #6fd0cf; --n7: #e3e9df; --n8: #9aa59d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper); color: var(--ink); font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(36px, 7vw, 56px); line-height: .9; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 small { display: block; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .14em; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
.levels { display: flex; gap: 6px; flex-wrap: wrap; }
.levels button, .tool {
  font: 500 14px/1 var(--f-body); color: var(--ink); background: transparent;
  border: 1.5px solid var(--line); border-radius: 4px; padding: 9px 12px; cursor: pointer;
}
.levels button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.levels button:hover, .tool:hover { border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

.panel { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.readout { display: flex; flex-direction: column; gap: 2px; }
.readout span { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.readout b { font: 700 26px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.status { flex: 1 1 160px; min-width: 0; font-weight: 500; font-size: 15px; }
.status[data-s="lost"] { color: var(--signal); }
.status[data-s="won"] { color: var(--win); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }

.scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.board {
  --cell: 34px;
  display: grid; grid-template-columns: repeat(var(--cols), var(--cell));
  gap: 2px; width: max-content; margin: 0 auto; user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}
.cell {
  width: var(--cell); height: var(--cell); padding: 0; border: 0; border-radius: 3px;
  background: var(--tile); cursor: pointer;
  box-shadow: inset 0 2px 0 var(--tile-hi), inset 0 -2px 0 var(--tile-lo);
  font: 700 calc(var(--cell) * .5)/1 var(--f-mono); color: var(--ink);
  display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
}
.cell:hover:not(.open) { filter: brightness(1.07); }
.cell.open { background: var(--open); box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
.cell.open.num { cursor: pointer; }
.cell.flag::after { content: ""; width: 42%; height: 46%; background: var(--signal);
  clip-path: polygon(18% 0, 100% 30%, 18% 60%, 18% 100%, 6% 100%, 6% 0); }
.cell.mine { background: var(--open); box-shadow: inset 0 0 0 1px var(--line); }
.cell.mine::after { content: ""; width: 46%; height: 46%; border-radius: 50%; background: var(--ink);
  box-shadow: 0 0 0 2px var(--open), 0 0 0 3px var(--ink); }
.cell.boom { background: var(--signal); }
.cell.boom::after { background: var(--signal-ink); box-shadow: 0 0 0 2px var(--signal), 0 0 0 3px var(--signal-ink); }
.cell.wrong { background: var(--open); box-shadow: inset 0 0 0 1px var(--line); }
.cell.wrong::after { content: "×"; color: var(--signal); font-size: calc(var(--cell) * .7); }
.n1{color:var(--n1)} .n2{color:var(--n2)} .n3{color:var(--n3)} .n4{color:var(--n4)}
.n5{color:var(--n5)} .n6{color:var(--n6)} .n7{color:var(--n7)} .n8{color:var(--n8)}
@media (prefers-reduced-motion: no-preference) {
  .cell.open { animation: pop .14s ease-out; }
  @keyframes pop { from { transform: scale(.85); } to { transform: none; } }
}

.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 24px; font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.help b { color: var(--ink); font-weight: 500; }
.best { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1><small>Field survey · grid sheet</small>雷區測繪</h1>
    <div class="levels" role="group" aria-label="難度">
      <button type="button" id="lv-easy" data-lv="easy" aria-pressed="true">初級 9×9</button>
      <button type="button" id="lv-mid" data-lv="mid" aria-pressed="false">中級 16×16</button>
      <button type="button" id="lv-hard" data-lv="hard" aria-pressed="false">高級 16×30</button>
    </div>
  </header>

  <section class="panel">
    <div class="bar">
      <div class="readout"><span>剩餘地雷</span><b id="left">010</b></div>
      <div class="readout"><span>時間（秒）</span><b id="time">000</b></div>
      <div class="status" id="status" data-s="ready" aria-live="polite">點任一格開始，第一下不會踩到雷。</div>
      <div class="tools">
        <button type="button" class="tool" id="flagMode" aria-pressed="false">插旗模式</button>
        <button type="button" class="tool" id="restart">重新開始</button>
      </div>
    </div>
    <div class="scroller"><div class="board" id="board" role="grid" aria-label="雷區"></div></div>
    <div class="best" id="best"></div>
  </section>

  <div class="help">
    <div><b>翻開</b>：點一下格子。數字代表周圍 8 格內的地雷數。</div>
    <div><b>插旗</b>：電腦按右鍵；手機長按，或切換「插旗模式」。</div>
    <div><b>快速翻開</b>：點已翻開的數字，若周圍旗子數相同，會翻開其餘格子。</div>
    <div><b>鍵盤</b>：方向鍵移動，Enter 翻開，F 插旗。</div>
  </div>
</div>

<script>
(() => {
  const LEVELS = {
    easy: { rows: 9, cols: 9, mines: 10, name: "初級" },
    mid:  { rows: 16, cols: 16, mines: 40, name: "中級" },
    hard: { rows: 16, cols: 30, mines: 99, name: "高級" },
  };
  const $ = id => document.getElementById(id);
  const boardEl = $("board"), leftEl = $("left"), timeEl = $("time"), statusEl = $("status"), bestEl = $("best");
  let lv = "easy", R, C, M, cells, els, started, over, opened, flags, t0, tick, flagMode = false;

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const pad = n => String(Math.max(-99, Math.min(999, n))).padStart(3, "0");
  const idx = (r, c) => r * C + c;
  function neighbors(i) {
    const r = Math.floor(i / C), c = i % C, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.push(idx(rr, cc));
    }
    return out;
  }

  function fitCell() {
    const avail = boardEl.parentElement.clientWidth;
    const size = Math.floor((avail - (C - 1) * 2) / C);
    boardEl.style.setProperty("--cell", Math.max(26, Math.min(38, size)) + "px");
  }

  function newGame(level) {
    if (level) lv = level;
    ({ rows: R, cols: C, mines: M } = LEVELS[lv]);
    cells = Array.from({ length: R * C }, () => ({ mine: false, n: 0, open: false, flag: false }));
    started = false; over = false; opened = 0; flags = 0;
    clearInterval(tick); timeEl.textContent = "000";
    document.querySelectorAll(".levels button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lv === lv));
    boardEl.style.setProperty("--cols", C);
    boardEl.innerHTML = "";
    els = cells.map((_, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "cell"; b.dataset.i = i;
      b.tabIndex = i === 0 ? 0 : -1;
      b.setAttribute("aria-label", `第 ${Math.floor(i / C) + 1} 列第 ${i % C + 1} 欄，未翻開`);
      boardEl.appendChild(b);
      return b;
    });
    fitCell();
    setStatus("ready", "點任一格開始，第一下不會踩到雷。");
    updateLeft(); showBest();
  }

  function placeMines(first) {
    const safe = new Set([first, ...neighbors(first)]);
    if (R * C - safe.size < M) { safe.clear(); safe.add(first); }
    const pool = [];
    for (let i = 0; i < R * C; i++) if (!safe.has(i)) pool.push(i);
    for (let k = 0; k < M; k++) {
      const j = k + Math.floor(Math.random() * (pool.length - k));
      [pool[k], pool[j]] = [pool[j], pool[k]];
      cells[pool[k]].mine = true;
    }
    cells.forEach((cell, i) => { cell.n = neighbors(i).filter(j => cells[j].mine).length; });
  }

  function startClock() {
    started = true; t0 = Date.now();
    setStatus("playing", "進行中。");
    tick = setInterval(() => { timeEl.textContent = pad(Math.floor((Date.now() - t0) / 1000)); }, 250);
  }

  function draw(i) {
    const cell = cells[i], b = els[i];
    b.className = "cell";
    const pos = `第 ${Math.floor(i / C) + 1} 列第 ${i % C + 1} 欄`;
    if (cell.open) {
      b.classList.add("open");
      if (cell.n) { b.classList.add("num", "n" + cell.n); b.textContent = cell.n; }
      else b.textContent = "";
      b.setAttribute("aria-label", `${pos}，${cell.n ? cell.n + " 顆雷相鄰" : "空白"}`);
    } else {
      b.textContent = "";
      if (cell.flag) b.classList.add("flag");
      b.setAttribute("aria-label", `${pos}，${cell.flag ? "已插旗" : "未翻開"}`);
    }
  }

  function open(i) {
    if (over) return;
    const cell = cells[i];
    if (cell.flag) return;
    if (!started) { placeMines(i); startClock(); }
    if (cell.open) { chord(i); return; }
    if (cell.mine) { lose(i); return; }
    const stack = [i];
    while (stack.length) {
      const k = stack.pop(), c = cells[k];
      if (c.open || c.flag) continue;
      c.open = true; opened++; draw(k);
      if (c.n === 0) neighbors(k).forEach(j => { if (!cells[j].open && !cells[j].mine) stack.push(j); });
    }
    checkWin();
  }

  function chord(i) {
    const cell = cells[i];
    if (!cell.open || !cell.n) return;
    const nb = neighbors(i);
    if (nb.filter(j => cells[j].flag).length !== cell.n) return;
    for (const j of nb) {
      if (over) return;
      if (!cells[j].open && !cells[j].flag) open(j);
    }
  }

  function toggleFlag(i) {
    if (over) return;
    const cell = cells[i];
    if (cell.open) return;
    cell.flag = !cell.flag; flags += cell.flag ? 1 : -1;
    draw(i); updateLeft();
  }

  function updateLeft() { leftEl.textContent = pad(M - flags); }
  function setStatus(s, text) { statusEl.dataset.s = s; statusEl.textContent = text; }

  function lose(i) {
    over = true; clearInterval(tick);
    cells.forEach((c, k) => {
      if (c.mine && !c.flag) { els[k].className = "cell mine"; els[k].textContent = ""; }
      else if (!c.mine && c.flag) { els[k].className = "cell wrong"; }
    });
    els[i].classList.add("boom");
    setStatus("lost", "踩到地雷了。按「重新開始」再來一局。");
  }

  function checkWin() {
    if (opened !== R * C - M) return;
    over = true; clearInterval(tick);
    const secs = Math.floor((Date.now() - t0) / 1000);
    timeEl.textContent = pad(secs);
    cells.forEach((c, k) => { if (c.mine && !c.flag) { c.flag = true; draw(k); } });
    flags = M; updateLeft();
    const best = store.get("ms-best") || {};
    const isBest = best[lv] == null || secs < best[lv];
    if (isBest) { best[lv] = secs; store.set("ms-best", best); }
    setStatus("won", `完成！用時 ${secs} 秒${isBest ? "，刷新本機最佳紀錄。" : "。"}`);
    showBest();
  }

  function showBest() {
    const best = store.get("ms-best") || {};
    const parts = Object.entries(LEVELS).map(([k, v]) => `${v.name} ${best[k] != null ? best[k] + " 秒" : "—"}`);
    bestEl.textContent = "本機最佳紀錄：" + parts.join(" · ");
  }

  // Input: click / right-click / long-press / keyboard
  let pressTimer = null, longFired = false;
  const cellOf = e => e.target.closest(".cell");
  boardEl.addEventListener("pointerdown", e => {
    const b = cellOf(e); if (!b) return;
    longFired = false;
    if (e.pointerType === "touch") {
      pressTimer = setTimeout(() => {
        longFired = true; toggleFlag(+b.dataset.i);
        if (navigator.vibrate) try { navigator.vibrate(15); } catch {}
      }, 380);
    }
  });
  const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
  boardEl.addEventListener("pointerup", cancelPress);
  boardEl.addEventListener("pointercancel", cancelPress);
  boardEl.addEventListener("pointerleave", cancelPress);
  boardEl.addEventListener("click", e => {
    const b = cellOf(e); if (!b) return;
    if (longFired) { longFired = false; return; }
    const i = +b.dataset.i;
    if (flagMode && !cells[i].open) toggleFlag(i); else open(i);
  });
  boardEl.addEventListener("contextmenu", e => {
    const b = cellOf(e); if (!b) return;
    e.preventDefault();
    if (longFired) return;
    toggleFlag(+b.dataset.i);
  });
  boardEl.addEventListener("keydown", e => {
    const b = cellOf(e); if (!b) return;
    const i = +b.dataset.i, r = Math.floor(i / C), c = i % C;
    const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (moves[e.key]) {
      e.preventDefault();
      const rr = Math.max(0, Math.min(R - 1, r + moves[e.key][0])), cc = Math.max(0, Math.min(C - 1, c + moves[e.key][1]));
      const n = els[idx(rr, cc)];
      b.tabIndex = -1; n.tabIndex = 0; n.focus();
    } else if (e.key === "f" || e.key === "F") { e.preventDefault(); toggleFlag(i); }
  });

  document.querySelectorAll(".levels button").forEach(b => b.addEventListener("click", () => newGame(b.dataset.lv)));
  $("restart").addEventListener("click", () => newGame());
  $("flagMode").addEventListener("click", e => {
    flagMode = !flagMode; e.currentTarget.setAttribute("aria-pressed", flagMode);
  });
  window.addEventListener("resize", () => { if (C) fitCell(); });

  newGame("easy");
})();
</script>
</body>
</html>
